<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Find a Slot - EasyPark</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
    body { background-color: #f5f5f5; color: #333; }

    header {
      background-color: #1e90ff;
      color: white;
      padding: 15px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .logo-container img {
      height: 70px;
    }
    .logo-container h1 {
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 2px;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 25px;
      font-weight: bold;
      font-size: 18px;
    }
    nav a:hover { text-decoration: underline; }

    .form-section {
      padding: 60px 50px;
      background-color: #ffffff;
      max-width: 700px;
      margin: 40px auto;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .form-section h2 {
      font-size: 36px;
      color: #1e90ff;
      margin-bottom: 30px;
      text-align: center;
    }
    form label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
      font-size: 16px;
    }
    form input, form select {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    form button {
      background-color: #1e90ff;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 18px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    form button:hover {
      background-color: #187bcd;
    }

    footer {
      background-color: #1e90ff;
      color: white;
      padding: 20px 50px;
      text-align: center;
      margin-top: 60px;
    }

    @media (max-width: 768px) {
      header { flex-direction: column; align-items: flex-start; }
      nav { margin-top: 10px; }
      .form-section { padding: 40px 20px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="Screenshot_2025-10-06_160522-removebg-preview.png" alt="EasyPark Logo">
      <h1>EasyPark</h1>
    </div>
    <nav>
      <a href="home.html">Home</a>
      <a href="about.html">About</a>
      <a href="venue.html">Venues</a>
      <a href="adminlogin.html">Admin Login</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section class="form-section">
    <h2>Find a Parking Slot</h2>
<form action="reserve.php" method="POST">
      <label for="name">Full Name</label>
<input type="text" id="name" name="name" placeholder="Enter your name" required>

<label for="contact">Contact Number</label>
<input type="tel" id="contact" name="contact" placeholder="Enter your phone number" pattern="[0-9]{10}" required>

  <label for="location">Location</label>
<input type="text" id="location" name="location" list="locations" placeholder="Enter location" required>
<datalist id="locations">
  <option value="Downtown Mall">
  <option value="City Centre">
  <option value="Tech Park">
  <option value="Railway Station Parking">
  <option value="Airport Parking">
</datalist>


      <label for="date">Select Date</label>
      <input type="date" id="date" name="date" required>

      <label for="time">Select Time</label>
      <input type="time" id="time" name="time" required>

      <label for="duration">Duration (in minutes)</label>
      <input type="number" id="duration" name="duration" min="1" max="60" required>

      <button type="submit">Check Availability</button>
    </form>
  </section>

  <footer>
    &copy; 2025 EasyPark. All rights reserved. | Contact: support@easypark.com
  </footer>

</body>
</html>
