<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyPark - Admin Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
    body { background-color: #f5f5f5; color: #333; }

    /* Header */
    header {
      background-color: #1e90ff;
      color: white;
      padding: 15px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .logo-container {
      display: flex;
      align-items:center;
      gap: 5px;
    }
    .logo-container img { height: 70px; }
    .logo-container h1 { font-size: 36px; font-weight: bold; letter-spacing: 2px; }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 25px;
      font-weight: bold;
      font-size: 18px;
    }
    nav a:hover { text-decoration: underline; }

    /* Login Section */
    .login-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 75vh;
      background-color: #fff;
    }

    .login-box {
      background-color: #f0f8ff;
      padding: 40px 50px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 400px;
      text-align: center;
    }

    .login-box h2 {
      color: #1e90ff;
      margin-bottom: 30px;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background-color: #1e90ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
    }

    .login-box button:hover { background-color: #187bcd; }

    .login-box p {
      margin-top: 20px;
      font-size: 14px;
    }

    .login-box a {
      color: #1e90ff;
      font-weight: bold;
      text-decoration: none;
    }

    .login-box a:hover {
      text-decoration: underline;
    }

    /* Footer */
    footer {
      background-color: #1e90ff;
      color: white;
      padding: 20px 50px;
      text-align: center;
    }

    @media (max-width: 768px) {
      .login-box { width: 85%; }
      header { flex-direction: column; align-items: flex-start; }
      nav { margin-top: 10px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo-container">
      <img src="Screenshot_2025-10-06_160522-removebg-preview.png" alt="EasyPark Logo">
      <h1>EasyPark</h1>
    </div>
    <nav>
      <a href="home.html">Home</a>
      <a href="about.html">About</a>
      <a href="venue.html">Venues</a>
      <a href="adminlogin.html">Admin Login</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- Login Section -->
  <section class="login-section">
    <div class="login-box">
      <h2>Venue Admin Login</h2>
      <form action="adminlogin.php" method="POST">
        <input type="text" name="venueName" placeholder="Enter Venue Name" required>
        <input type="email" name="email" placeholder="Enter Email" required>
        <input type="password" name="password" placeholder="Enter Password" required>
        <button type="submit">Login</button>
      </form>
      <p>New Venue? <a href="register.html">Register Here</a></p>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    &copy; 2025 EasyPark. All rights reserved. | Contact: support@easypark.com
  </footer>

</body>
</html>
